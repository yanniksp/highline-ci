name: Astro PR

# Wiederverwendbarer Workflow fuer alle Highline-Astro-Sites.
# Aufruf im Kundenrepo: siehe README.

on:
  workflow_call:
    inputs:
      node-version:
        description: "Node-Hauptversion"
        type: string
        default: "22"
      dist-dir:
        description: "Gebauter Client-Output fuer den Smoke-Test"
        type: string
        default: "dist/client"

jobs:
  build:
    name: Build & Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: astro-pr-${{ github.repository }}-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Repo auschecken
        uses: actions/checkout@v7

      - name: Node einrichten
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm

      - name: Abhaengigkeiten (aus dem Lockfile)
        run: npm ci

      # Kein "astro check": Instaltec hat 22 offene Typfehler (Stand 03.09.2026).
      # Typecheck kommt dazu, wenn die abgeraeumt sind - nicht als Blocker am Tag eins.
      - name: Lint
        run: npm run lint --if-present

      - name: Build
        run: npm run build

      # Bewusst erst NACH Lint und Build: das Werkzeug-Repo liegt sonst im
      # Workspace, waehrend biome und astro ueber "." laufen.
      - name: CI-Werkzeuge holen
        uses: actions/checkout@v7
        with:
          repository: yanniksp/highline-ci
          ref: main
          path: .highline-ci

      - name: Smoke-Test
        run: node .highline-ci/smoke.mjs "${{ inputs.dist-dir }}"

      # Der Fehler vom 03.09.2026 war Build gruen, Deploy kaputt. Die beiden
      # folgenden Schritte pruefen den Deploy, nicht den Build.
      #
      # Der Dry-Run braucht KEINE Cloudflare-Zugangsdaten (nachgemessen mit
      # leerem WRANGLER_HOME: exit 0). Er faengt, was wrangler beim Parsen
      # ablehnt -- fehlendes compatibility_date etwa.
      - name: Deploy-Probelauf (ohne Zugangsdaten)
        if: hashFiles('wrangler.jsonc', 'wrangler.json', 'wrangler.toml') != ''
        run: npx wrangler deploy --dry-run

      # Der Dry-Run faengt den 03.09.-Fehler NICHT: eine KV-Bindung ohne "id"
      # laesst er mit exit 0 durch, provisioniert wird erst beim echten Deploy.
      # Deshalb zusaetzlich die Invarianten der generierten Config.
      - name: Deploy-Konfiguration pruefen
        if: hashFiles('wrangler.jsonc', 'wrangler.json') != ''
        run: node .highline-ci/check-deploy-config.mjs
